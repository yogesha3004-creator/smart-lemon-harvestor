model:
  architecture: efficientnet_b0
  pretrained: true
  num_ripeness_classes: 3  # raw, semi_ripe, ripe
  num_quality_classes: 3   # grade_a, grade_b, grade_c
  dropout: 0.3
  input_size: 224

training:
  epochs: 50
  batch_size: 32
  learning_rate: 0.001
  weight_decay: 0.0001
  scheduler: cosine
  patience: 10
  num_workers: 4

augmentation:
  random_horizontal_flip: true
  random_rotation: 15
  color_jitter:
    brightness: 0.2
    contrast: 0.2
    saturation: 0.2
    hue: 0.1
  random_resized_crop:
    scale: [0.8, 1.0]

data:
  dataset_path: data/classification
  train: train
  val: val
  test: test

paths:
  weights_dir: weights/classifier
  results_dir: runs/classifier
