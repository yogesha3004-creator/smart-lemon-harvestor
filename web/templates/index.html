<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>🍋 Smart Lemon Harvester AI — Live Vision</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap');

    body {
      background: radial-gradient(circle at top right, #0d2818 0%, #070d19 45%, #030712 100%);
      color: #f1f5f9;
      font-family: 'Space Grotesk', -apple-system, sans-serif;
      min-height: 100vh;
      touch-action: manipulation;
    }

    .font-mono {
      font-family: 'JetBrains Mono', monospace;
    }

    .glass {
      background: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }

    .glass-glow-green {
      border: 1px solid rgba(16, 185, 129, 0.5);
      box-shadow: 0 0 30px rgba(16, 185, 129, 0.3);
    }

    .glass-glow-gold {
      border: 1px solid rgba(250, 204, 21, 0.5);
      box-shadow: 0 0 30px rgba(250, 204, 21, 0.25);
    }

    /* Cyber Viewfinder Reticle */
    .reticle-corner {
      position: absolute;
      width: 22px;
      height: 22px;
      border-color: rgba(250, 204, 21, 0.85);
      pointer-events: none;
    }
    .reticle-tl { top: 12px; left: 12px; border-top: 2.5px solid; border-left: 2.5px solid; }
    .reticle-tr { top: 12px; right: 12px; border-top: 2.5px solid; border-right: 2.5px solid; }
    .reticle-bl { bottom: 12px; left: 12px; border-bottom: 2.5px solid; border-left: 2.5px solid; }
    .reticle-br { bottom: 12px; right: 12px; border-bottom: 2.5px solid; border-right: 2.5px solid; }

    /* Animated Scanning Laser */
    .scan-laser {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, #10b981, #facc15, transparent);
      box-shadow: 0 0 14px #10b981;
      animation: scan 2.5s ease-in-out infinite alternate;
      pointer-events: none;
    }

    @keyframes scan {
      0% { transform: translateY(0); opacity: 0.2; }
      50% { opacity: 0.9; }
      100% { transform: translateY(280px); opacity: 0.2; }
    }

    .pulse-glow {
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(1.15); }
    }
  </style>
</head>
<body class="flex flex-col pb-8">

  <!-- Top App Bar -->
  <header class="glass sticky top-0 z-40 px-4 py-3 border-b border-slate-800 flex items-center justify-between">
    <div class="flex items-center gap-2.5">
      <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-yellow-400 to-amber-600 flex items-center justify-center text-xl shadow-lg shadow-yellow-500/20">
        🍋
      </div>
      <div>
        <div class="flex items-center gap-1.5">
          <h1 class="text-sm font-bold tracking-tight text-white uppercase">Lemon Harvester AI</h1>
          <span class="px-1.5 py-0.5 rounded text-[9px] font-mono font-semibold bg-emerald-500/20 text-emerald-400 border border-emerald-500/30">LIVE</span>
        </div>
        <p class="text-[11px] text-slate-400 flex items-center gap-1.5 font-mono">
          <span class="w-2 h-2 rounded-full bg-emerald-400 inline-block pulse-glow"></span>
          YOLOv8 + EfficientNet
        </p>
      </div>
    </div>

    <!-- Camera Source Selector -->
    <div class="flex items-center gap-2">
      <select id="cameraSourceSelect" class="bg-slate-900 border border-slate-700 text-xs font-semibold rounded-xl px-2.5 py-1.5 text-yellow-300 focus:outline-none focus:border-yellow-400">
        <option value="2" selected>📱 Phone Camera (Iriun - Cam 2)</option>
        <option value="0">💻 Laptop Webcam (Cam 0)</option>
      </select>
    </div>
  </header>

  <!-- Main Container -->
  <main class="flex-1 flex flex-col px-4 pt-3 max-w-md mx-auto w-full gap-3">

    <!-- Viewfinder Container -->
    <div class="relative w-full aspect-[4/3] rounded-2xl overflow-hidden glass border border-slate-800 shadow-2xl flex items-center justify-center bg-black/90">
      
      <!-- Live Stream MJPEG Image (Direct from Python Backend) -->
      <img id="liveStreamFeed" src="/api/video_feed?source=2" class="w-full h-full object-cover" alt="Live AI Detection Feed">

      <!-- Laser Scanner Effect -->
      <div class="scan-laser"></div>

      <!-- Targeting Reticle Brackets -->
      <div class="reticle-corner reticle-tl"></div>
      <div class="reticle-corner reticle-tr"></div>
      <div class="reticle-corner reticle-bl"></div>
      <div class="reticle-corner reticle-br"></div>

      <!-- Live Stream Status Overlay -->
      <div class="absolute bottom-3 left-3 z-20 px-2.5 py-1 rounded-lg bg-black/60 backdrop-blur-md border border-white/10 text-[10px] font-mono text-slate-300 flex items-center gap-1.5">
        <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 pulse-glow"></span>
        <span id="viewfinderCounter">0 Lemons in frame</span>
      </div>

      <!-- Reload / Fullscreen Actions -->
      <div class="absolute bottom-3 right-3 z-20 flex gap-1.5">
        <button id="refreshStreamBtn" title="Restart Stream" class="w-8 h-8 rounded-lg bg-black/60 backdrop-blur-md border border-white/10 text-white flex items-center justify-center text-xs active:scale-90 transition hover:bg-black/80">
          <i class="fa-solid fa-arrows-rotate"></i>
        </button>
      </div>
    </div>

    <!-- Harvest Decision Banner (Dynamic Glow) -->
    <div id="harvestBanner" class="p-3.5 rounded-2xl text-center hidden transition-all duration-300">
      <!-- Populated via JS -->
    </div>

    <!-- Metrics Matrix Grid -->
    <div class="grid grid-cols-3 gap-2">
      <div class="glass p-3 rounded-xl text-center border-slate-800">
        <span class="text-[10px] font-bold uppercase tracking-wider text-slate-400">Total Found</span>
        <span id="metricTotal" class="text-xl font-bold font-mono text-white mt-0.5 block">0</span>
      </div>
      <div class="glass p-3 rounded-xl text-center border-emerald-500/20 bg-emerald-500/5">
        <span class="text-[10px] font-bold uppercase tracking-wider text-emerald-400">Ready to Pick</span>
        <span id="metricPick" class="text-xl font-bold font-mono text-emerald-400 mt-0.5 block">0</span>
      </div>
      <div class="glass p-3 rounded-xl text-center border-amber-500/20 bg-amber-500/5">
        <span class="text-[10px] font-bold uppercase tracking-wider text-amber-400">Ripening</span>
        <span id="metricWait" class="text-xl font-bold font-mono text-amber-400 mt-0.5 block">0</span>
      </div>
    </div>

    <!-- Detected Lemons Detail Card -->
    <div class="glass rounded-2xl p-4 flex flex-col gap-2.5">
      <div class="flex items-center justify-between border-b border-slate-800 pb-2">
        <h2 class="text-xs font-bold text-slate-200 uppercase tracking-wider flex items-center gap-1.5">
          <i class="fa-solid fa-list-check text-yellow-400"></i> Live Lemon Attributes
        </h2>
        <span id="latencyDisplay" class="text-[10px] font-mono text-emerald-400">FEED ACTIVE</span>
      </div>

      <div id="detectionDetailsList" class="flex flex-col gap-2 max-h-52 overflow-y-auto pr-1">
        <div class="text-center py-6 text-xs text-slate-500 flex flex-col items-center gap-1.5">
          <i class="fa-solid fa-lemon text-xl text-yellow-500/50"></i>
          <span>Aim phone camera at a lemon to view ripeness & grade</span>
        </div>
      </div>
    </div>

  </main>

  <script>
    const streamFeed = document.getElementById('liveStreamFeed');
    const cameraSelect = document.getElementById('cameraSourceSelect');
    const refreshBtn = document.getElementById('refreshStreamBtn');

    const harvestBanner = document.getElementById('harvestBanner');
    const metricTotal = document.getElementById('metricTotal');
    const metricPick = document.getElementById('metricPick');
    const metricWait = document.getElementById('metricWait');
    const detectionDetailsList = document.getElementById('detectionDetailsList');
    const viewfinderCounter = document.getElementById('viewfinderCounter');

    // Change camera source
    cameraSelect.addEventListener('change', () => {
      const selectedCam = cameraSelect.value;
      streamFeed.src = `/api/video_feed?source=${selectedCam}&t=${Date.now()}`;
    });

    // Refresh Stream button
    refreshBtn.addEventListener('click', () => {
      const selectedCam = cameraSelect.value;
      streamFeed.src = `/api/video_feed?source=${selectedCam}&t=${Date.now()}`;
    });

    // Poll latest stats from Python backend every 400ms
    async function pollStats() {
      try {
        const res = await fetch('/api/stream_stats');
        const data = await res.json();
        const summary = data.summary;
        const detections = data.detections;

        metricTotal.textContent = summary.total_lemons || 0;
        metricPick.textContent = summary.harvestable || 0;
        metricWait.textContent = summary.not_ready || 0;
        viewfinderCounter.textContent = `${summary.total_lemons || 0} Lemons in frame`;

        // Update Harvest Decision Banner
        if (summary.total_lemons > 0) {
          harvestBanner.classList.remove('hidden');
          if (summary.harvestable > 0) {
            harvestBanner.className = 'p-3.5 rounded-2xl text-center glass-glow-green bg-emerald-950/40 border border-emerald-500/40';
            harvestBanner.innerHTML = `
              <div class="flex items-center justify-center gap-2 text-emerald-400 font-bold text-sm tracking-wide uppercase">
                <i class="fa-solid fa-circle-check text-base"></i> Harvest Recommended
              </div>
              <p class="text-xs text-emerald-200/80 mt-1">${summary.harvestable} Lemon(s) ready to pick!</p>
            `;
          } else {
            harvestBanner.className = 'p-3.5 rounded-2xl text-center glass-glow-gold bg-amber-950/40 border border-amber-500/40';
            harvestBanner.innerHTML = `
              <div class="flex items-center justify-center gap-2 text-amber-400 font-bold text-sm tracking-wide uppercase">
                <i class="fa-solid fa-hourglass-half text-base"></i> Not Ready for Picking
              </div>
              <p class="text-xs text-amber-200/80 mt-1">Lemons are still raw or semi-ripe.</p>
            `;
          }
        } else {
          harvestBanner.classList.add('hidden');
        }

        // Update Detections List
        if (!detections || detections.length === 0) {
          detectionDetailsList.innerHTML = `
            <div class="text-center py-6 text-xs text-slate-500 flex flex-col items-center gap-1.5">
              <i class="fa-solid fa-lemon text-xl text-yellow-500/50"></i>
              <span>Aim phone camera at a lemon to view ripeness & grade</span>
            </div>
          `;
        } else {
          detectionDetailsList.innerHTML = detections.map((d, i) => {
            const isRipe = d.ripeness === 'ripe';
            const isSemi = d.ripeness === 'semi_ripe';
            const badgeClass = isRipe ? 'bg-emerald-500/20 text-emerald-400 border-emerald-500/40' :
                               isSemi ? 'bg-yellow-500/20 text-yellow-400 border-yellow-500/40' :
                               'bg-red-500/20 text-red-400 border-red-500/40';

            const harvestAction = d.harvest
              ? `<span class="px-2.5 py-1 rounded-lg text-xs font-bold bg-emerald-500 text-slate-950 shadow-md">PICK ✓</span>`
              : `<span class="px-2.5 py-1 rounded-lg text-xs font-bold bg-slate-800 text-slate-400 border border-slate-700">SKIP ✗</span>`;

            return `
              <div class="flex items-center justify-between p-2.5 rounded-xl bg-slate-900/80 border border-slate-800 text-xs hover:border-slate-700 transition">
                <div class="flex items-center gap-2">
                  <span class="w-6 h-6 rounded-md bg-slate-800 text-slate-300 font-mono font-bold flex items-center justify-center text-[10px]">#${i + 1}</span>
                  <div class="flex flex-col">
                    <div class="flex items-center gap-1.5">
                      <span class="px-2 py-0.5 rounded font-bold uppercase text-[10px] border ${badgeClass}">${d.ripeness}</span>
                      <span class="text-slate-400 text-[10px] uppercase font-mono">${d.size} · ${d.quality}</span>
                    </div>
                    <span class="text-[10px] text-slate-500 mt-0.5">Confidence: ${Math.round(d.ripeness_confidence * 100)}%</span>
                  </div>
                </div>
                <div>${harvestAction}</div>
              </div>
            `;
          }).join('');
        }
      } catch (err) {
        // Silently continue polling
      }
    }

    // Start polling loop
    setInterval(pollStats, 400);
  </script>
</body>
</html>
