<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>🍋 Smart Lemon Harvester AI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      background: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      touch-action: manipulation;
    }
    .glass {
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .badge-pick {
      background: linear-gradient(135deg, #10b981, #059669);
      box-shadow: 0 0 15px rgba(16, 185, 129, 0.5);
    }
    .badge-wait {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      box-shadow: 0 0 15px rgba(245, 158, 11, 0.4);
    }
    .pulse-dot {
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(1.2); }
    }
    /* Hide scrollbars */
    ::-webkit-scrollbar { display: none; }
  </style>
</head>
<body class="min-h-screen flex flex-col pb-6">

  <!-- Header -->
  <header class="glass sticky top-0 z-30 px-4 py-3 flex items-center justify-between border-b border-slate-700/50">
    <div class="flex items-center gap-2">
      <span class="text-2xl">🍋</span>
      <div>
        <h1 class="text-base font-bold tracking-tight text-white leading-tight">Lemon Harvester AI</h1>
        <p class="text-xs text-emerald-400 font-medium flex items-center gap-1">
          <span class="w-2 h-2 rounded-full bg-emerald-400 pulse-dot inline-block"></span> Live Detection
        </p>
      </div>
    </div>
    <div class="flex items-center gap-2">
      <button id="switchCameraBtn" class="p-2 rounded-xl bg-slate-800 text-slate-300 hover:text-white border border-slate-700 text-sm active:scale-95 transition">
        <i class="fa-solid fa-camera-rotate"></i>
      </button>
      <label for="galleryInput" class="p-2 rounded-xl bg-slate-800 text-slate-300 hover:text-white border border-slate-700 text-sm active:scale-95 transition cursor-pointer">
        <i class="fa-solid fa-image"></i>
      </label>
      <input type="file" id="galleryInput" accept="image/*" class="hidden">
    </div>
  </header>

  <!-- Main Viewport Area -->
  <main class="flex-1 flex flex-col px-4 pt-3 max-w-lg mx-auto w-full gap-3">

    <!-- Camera Viewport Card -->
    <div class="relative w-full aspect-[4/3] rounded-2xl overflow-hidden glass shadow-2xl flex items-center justify-center bg-black/60 border border-slate-700">
      
      <!-- Video Element -->
      <video id="cameraVideo" autoplay playsinline muted class="w-full h-full object-cover"></video>

      <!-- Annotated Overlay Image (when received from server) -->
      <img id="annotatedImage" class="absolute inset-0 w-full h-full object-cover hidden" alt="Annotated Detection">

      <!-- Status Overlay Badge -->
      <div id="harvestBanner" class="absolute top-3 left-3 right-3 py-2 px-3 rounded-xl text-center text-xs font-bold uppercase tracking-wider hidden transition-all duration-300">
        <!-- Injected via JS -->
      </div>

      <!-- Live Loading Spinner -->
      <div id="cameraLoading" class="absolute flex flex-col items-center gap-2 text-slate-400 text-sm">
        <i class="fa-solid fa-circle-notch fa-spin text-2xl text-yellow-400"></i>
        <span>Starting camera...</span>
      </div>

      <!-- Controls Overlay on Camera -->
      <div class="absolute bottom-3 right-3 flex items-center gap-2">
        <button id="modeToggleBtn" class="px-3 py-1.5 rounded-full text-xs font-semibold bg-black/60 backdrop-blur-md text-white border border-white/20 active:scale-95 transition flex items-center gap-1.5">
          <span class="w-2 h-2 rounded-full bg-emerald-400 inline-block" id="modeIndicator"></span>
          <span id="modeText">Live Mode</span>
        </button>
      </div>
    </div>

    <!-- Snap Photo Button (shown in Snap Mode or as manual trigger) -->
    <div class="flex gap-2">
      <button id="captureBtn" class="flex-1 py-3 px-4 rounded-xl font-semibold bg-gradient-to-r from-yellow-500 to-amber-600 hover:from-yellow-400 hover:to-amber-500 text-slate-900 active:scale-98 transition shadow-lg flex items-center justify-center gap-2">
        <i class="fa-solid fa-camera"></i>
        <span>Scan Frame Now</span>
      </button>
      <button id="resetBtn" class="py-3 px-4 rounded-xl font-semibold bg-slate-800 hover:bg-slate-700 text-slate-300 active:scale-98 transition border border-slate-700">
        <i class="fa-solid fa-rotate-left"></i>
      </button>
    </div>

    <!-- Summary Stats Grid -->
    <div class="grid grid-cols-3 gap-2">
      <div class="glass p-3 rounded-xl text-center">
        <span class="text-xs text-slate-400 block font-medium">Detected</span>
        <span id="statTotal" class="text-xl font-bold text-white mt-0.5 block">0</span>
      </div>
      <div class="glass p-3 rounded-xl text-center border-emerald-500/30">
        <span class="text-xs text-emerald-400 block font-medium">Ready (Pick)</span>
        <span id="statHarvestable" class="text-xl font-bold text-emerald-400 mt-0.5 block">0</span>
      </div>
      <div class="glass p-3 rounded-xl text-center border-amber-500/30">
        <span class="text-xs text-amber-400 block font-medium">Wait / Raw</span>
        <span id="statNotReady" class="text-xl font-bold text-amber-400 mt-0.5 block">0</span>
      </div>
    </div>

    <!-- Detailed Detections List -->
    <div class="glass rounded-2xl p-4 flex flex-col gap-2.5">
      <div class="flex items-center justify-between">
        <h2 class="text-sm font-semibold text-slate-200 flex items-center gap-1.5">
          <i class="fa-solid fa-list-check text-yellow-400 text-xs"></i> Detection Breakdown
        </h2>
        <span id="latencyBadge" class="text-[10px] text-slate-400 font-mono">-- ms</span>
      </div>
      
      <div id="detectionsList" class="flex flex-col gap-2 max-h-48 overflow-y-auto pr-1">
        <div class="text-center py-4 text-xs text-slate-500">
          Point phone camera at a lemon or tree to analyze
        </div>
      </div>
    </div>

  </main>

  <!-- Hidden Processing Canvas -->
  <canvas id="captureCanvas" class="hidden"></canvas>

  <script>
    const video = document.getElementById('cameraVideo');
    const annotatedImg = document.getElementById('annotatedImage');
    const canvas = document.getElementById('captureCanvas');
    const loading = document.getElementById('cameraLoading');
    const captureBtn = document.getElementById('captureBtn');
    const resetBtn = document.getElementById('resetBtn');
    const switchBtn = document.getElementById('switchCameraBtn');
    const modeToggleBtn = document.getElementById('modeToggleBtn');
    const modeText = document.getElementById('modeText');
    const modeIndicator = document.getElementById('modeIndicator');
    const harvestBanner = document.getElementById('harvestBanner');
    const galleryInput = document.getElementById('galleryInput');

    const statTotal = document.getElementById('statTotal');
    const statHarvestable = document.getElementById('statHarvestable');
    const statNotReady = document.getElementById('statNotReady');
    const detectionsList = document.getElementById('detectionsList');
    const latencyBadge = document.getElementById('latencyBadge');

    let isLive = true;
    let isProcessing = false;
    let currentFacingMode = 'environment'; // Default to BACK camera
    let liveInterval = null;

    // Start Phone Camera
    async function initCamera() {
      loading.classList.remove('hidden');
      if (video.srcObject) {
        video.srcObject.getTracks().forEach(track => track.stop());
      }
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: currentFacingMode,
            width: { ideal: 640 },
            height: { ideal: 480 }
          },
          audio: false
        });
        video.srcObject = stream;
        video.onloadedmetadata = () => {
          loading.classList.add('hidden');
          startLiveLoop();
        };
      } catch (err) {
        console.error('Camera error:', err);
        loading.innerHTML = `<span class="text-red-400 text-xs">Camera error: ${err.message}</span>`;
      }
    }

    // Capture current frame from video and send to Python server
    async function processCurrentFrame() {
      if (isProcessing) return;
      if (!video.videoWidth || !video.videoHeight) return;

      isProcessing = true;
      const startTime = performance.now();

      // Draw video frame to hidden canvas
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

      const base64Data = canvas.toDataURL('image/jpeg', 0.8);

      try {
        const res = await fetch('/api/predict', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ image: base64Data })
        });

        const data = await res.json();
        const latency = Math.round(performance.now() - startTime);
        latencyBadge.textContent = `${latency} ms`;

        if (data.success) {
          updateUI(data);
        }
      } catch (err) {
        console.error('Inference error:', err);
      } finally {
        isProcessing = false;
      }
    }

    // Update UI Elements with server response
    function updateUI(data) {
      const summary = data.summary;
      const detections = data.detections;

      // Update counters
      statTotal.textContent = summary.total_lemons;
      statHarvestable.textContent = summary.harvestable;
      statNotReady.textContent = summary.not_ready;

      // Update Harvest Banner
      if (summary.total_lemons > 0) {
        harvestBanner.classList.remove('hidden');
        if (summary.harvestable > 0) {
          harvestBanner.className = 'absolute top-3 left-3 right-3 py-2 px-3 rounded-xl text-center text-xs font-bold uppercase tracking-wider text-white badge-pick';
          harvestBanner.innerHTML = `<i class="fa-solid fa-check-circle"></i> ${summary.harvestable} Lemon(s) Ready to Pick!`;
        } else {
          harvestBanner.className = 'absolute top-3 left-3 right-3 py-2 px-3 rounded-xl text-center text-xs font-bold uppercase tracking-wider text-white badge-wait';
          harvestBanner.innerHTML = `<i class="fa-solid fa-hourglass-half"></i> Lemons Not Ready (Ripening)`;
        }
      } else {
        harvestBanner.classList.add('hidden');
      }

      // Update Detections List
      if (detections.length === 0) {
        detectionsList.innerHTML = `<div class="text-center py-4 text-xs text-slate-500">No lemons currently detected</div>`;
      } else {
        detectionsList.innerHTML = detections.map((d, i) => {
          const ripenessColor = d.ripeness === 'ripe' ? 'text-emerald-400 bg-emerald-500/10 border-emerald-500/30' :
                                d.ripeness === 'semi_ripe' ? 'text-yellow-400 bg-yellow-500/10 border-yellow-500/30' :
                                'text-red-400 bg-red-500/10 border-red-500/30';
          const harvestBadge = d.harvest 
            ? `<span class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-emerald-500 text-slate-900">PICK ✓</span>`
            : `<span class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-slate-700 text-slate-300">SKIP ✗</span>`;

          return `
            <div class="flex items-center justify-between p-2.5 rounded-xl bg-slate-800/80 border border-slate-700 text-xs">
              <div class="flex items-center gap-2">
                <span class="font-bold text-slate-400">#${i + 1}</span>
                <span class="px-2 py-0.5 rounded-md font-semibold border ${ripenessColor}">
                  ${d.ripeness} (${Math.round(d.ripeness_confidence * 100)}%)
                </span>
                <span class="text-slate-400 uppercase text-[10px]">${d.size} · ${d.quality}</span>
              </div>
              <div>${harvestBadge}</div>
            </div>
          `;
        }).join('');
      }

      // Show annotated overlay if in snapshot mode
      if (!isLive && data.annotated_image) {
        annotatedImg.src = data.annotated_image;
        annotatedImg.classList.remove('hidden');
      }
    }

    // Live continuous inference loop (~3 FPS for smooth performance)
    function startLiveLoop() {
      if (liveInterval) clearInterval(liveInterval);
      if (isLive) {
        liveInterval = setInterval(processCurrentFrame, 350);
      }
    }

    // Toggle Live Mode / Snapshot Mode
    modeToggleBtn.addEventListener('click', () => {
      isLive = !isLive;
      if (isLive) {
        modeText.textContent = 'Live Mode';
        modeIndicator.className = 'w-2 h-2 rounded-full bg-emerald-400 inline-block';
        annotatedImg.classList.add('hidden');
        startLiveLoop();
      } else {
        modeText.textContent = 'Snap Mode';
        modeIndicator.className = 'w-2 h-2 rounded-full bg-amber-400 inline-block';
        if (liveInterval) clearInterval(liveInterval);
      }
    });

    // Manual Capture Button
    captureBtn.addEventListener('click', async () => {
      await processCurrentFrame();
    });

    // Reset View Button
    resetBtn.addEventListener('click', () => {
      annotatedImg.classList.add('hidden');
      if (isLive) startLiveLoop();
    });

    // Switch between Front & Back camera
    switchBtn.addEventListener('click', () => {
      currentFacingMode = (currentFacingMode === 'environment') ? 'user' : 'environment';
      initCamera();
    });

    // Gallery Photo Upload Handler
    galleryInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = async (event) => {
        isLive = false;
        if (liveInterval) clearInterval(liveInterval);
        modeText.textContent = 'Snap Mode';
        modeIndicator.className = 'w-2 h-2 rounded-full bg-amber-400 inline-block';

        loading.classList.remove('hidden');
        try {
          const res = await fetch('/api/predict', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ image: event.target.result })
          });
          const data = await res.json();
          if (data.success) {
            updateUI(data);
            annotatedImg.src = data.annotated_image;
            annotatedImg.classList.remove('hidden');
          }
        } catch (err) {
          console.error(err);
        } finally {
          loading.classList.add('hidden');
        }
      };
      reader.readAsDataURL(file);
    });

    // Initialize on page load
    window.addEventListener('DOMContentLoaded', initCamera);
  </script>
</body>
</html>
